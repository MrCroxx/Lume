name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v0.1.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release_please:
    name: Prepare release
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create release app token
        id: release-app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-app-token.outputs.token || github.token }}

  release_context:
    name: Resolve release context
    if: >-
      always() &&
      (needs.release_please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    needs: release_please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.release_please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected tag in vMAJOR.MINOR.PATCH format" >&2
              exit 1
            fi
            release_is_draft=$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $INPUT_TAG is already published" >&2
              exit 1
            fi
            release_ref="$INPUT_TAG"
            release_tag="$INPUT_TAG"
            release_version="${INPUT_TAG#v}"
          else
            release_ref="$RELEASE_SHA"
            release_tag="$RELEASE_TAG"
            release_version="$RELEASE_VERSION"
          fi

          {
            echo "ref=$release_ref"
            echo "tag_name=$release_tag"
            echo "version=$release_version"
          } >> "$GITHUB_OUTPUT"

  publish_image:
    name: Publish release image
    needs: release_context
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_context.outputs.ref }}

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release_context.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
        run: |
          python3 scripts/check_version_sync.py
          repository_version=$(tr -d '\r\n' < VERSION)
          if [[ "$RELEASE_VERSION" != "$repository_version" ]]; then
            echo "Release version $RELEASE_VERSION does not match VERSION $repository_version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$repository_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match v$repository_version" >&2
            exit 1
          fi

      - name: Prepare image metadata inputs
        id: image
        shell: bash
        run: |
          {
            echo "name=${GITHUB_REPOSITORY,,}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release_context.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release_context.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release_context.outputs.tag_name }},enable=${{ !startsWith(needs.release_context.outputs.version, '0.') }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.image.outputs.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lume-image
          cache-to: type=gha,mode=max,scope=lume-image

      - name: Attest image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Promote release image tags
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "No release image tags were generated" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE@$IMAGE_DIGEST"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release_context.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --latest --verify-tag
