[package]
name = "lume-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.8.2"
argon2 = "0.5.3"
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
chacha20poly1305 = "0.10.1"
futures-util = "0.3.33"
ipnet = "2.12.1"
mime_guess = "2.0.5"
opendal = { version = "0.58.1", features = ["services-fs", "services-ftp", "services-sftp", "services-webdav", "services-s3"] }
rand = "0.10.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"
